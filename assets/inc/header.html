<header class="l-header">
    <div class="l-header-logo">
        <a href="{$root}#top" class="js-scroll">
        <!-- [SVG LOGO] Brand wordmark, 161x34. Paste your own logo SVG/asset here. -->
        <img src="{$root}assets/img/pic/logo.png" class="u-img-responsive" style="opacity: 1;">
        </a>
    </div>
</header>

<div class="l-gnav" style="background-image: url({$root}assets/img/pic/menu_bg.webp);">
    <div class="l-gnav-logo">
        <a href="https://dolive.media/" target="_blank">
        <!-- [SVG LOGO] Company wordmark, 97x27, fill #678666. Paste your own logo SVG/asset here. -->
        <svg width="97" height="27" viewBox="0 0 97 27" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="logo"></svg>
        </a>
    </div>
    <div class="l-gnav-logo-2">
        <img src="{$root}assets/img/pic/logo.png" class="u-img-responsive" style="opacity: 1;">
    </div>
    <div class="l-gnav__body">
        <div class="l-gnav__close">
            <div class="l-gnav__btn-circle">
                <svg width="101" height="94" viewBox="0 0 101 94" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path id="circlePath5" d="M50.5 93.5C22.8513 93.5 0.5 72.648 0.5 47
                        C0.5 21.352 22.8513 0.5 50.5 0.5
                        C78.1487 0.5 100.5 21.352 100.5 47
                        C100.5 72.648 78.1487 93.5 50.5 93.5Z" stroke="#D6C0A6" fill="#F4E3D0" />
                </svg>
                <div class="l-gnav__btn-text">CLOSE</div>
            </div>
        </div>
        <div class="l-gnav__ttl">MENU</div>
        <div class="l-gnav__list">
            <div class="l-gnav__item">
                <a href="{$root}#concept" class="js-scroll">
                <p>CONCEPT</p>
                </a>
            </div>
            <div class="l-gnav__item">
                <a href="{$root}#product" class="js-scroll">
                <p>PRODUCT</p>
                </a>
            </div>
            <div class="l-gnav__item">
                <a href="{$root}#spec" class="js-scroll">
                <p>SPEC</p>
                </a>
            </div>
            <div class="l-gnav__item">
                <a href="{$root}#order" class="js-scroll">
                <p>HOW TO ORDER</p>
                </a>
            </div>
            <div class="l-gnav__item">
                <a href="{$root}#topics" class="js-scroll">
                <p>TOPICS</p>
                </a>
            </div>
        </div>

        <div class="l-gnav__flowbtn">
            <div class="c-flowbtn__list">
                <div class="c-flowbtn__item c-flowbtn__item--1">
                    <a href="https://house.dolive.media/shop/" target="_blank">
                        お近くの取扱店に<br>相談する
                    </a>
                </div>
            </div>
        </div>
        <div class="l-gnav__copy">A lifestyle that shapes the scenery of everyday life through design</div>
    </div>
</div>

<div class="l-gnav__btn">
    <div class="l-gnav__btn-circle">
        <svg width="101" height="94" viewBox="0 0 101 94" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path id="circlePath" d="M50.5 93.5C22.8513 93.5 0.5 72.648 0.5 47
                    C0.5 21.352 22.8513 0.5 50.5 0.5
                    C78.1487 0.5 100.5 21.352 100.5 47
                    C100.5 72.648 78.1487 93.5 50.5 93.5Z" stroke="#F4E3D0" fill="none" />
        </svg>
        <div class="l-gnav__btn-text">MENU</div>
    </div>
</div>
